<!DOCTYPE html>
<html>
<head>
    <title>Bot</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="">
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="shortcut icon" href="favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="stylesheet" type="text/css" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
</head>
<body>
  <h1>ESP32 Web BLE Application v1.25</h1>
  <div class="button-container two-buttons">
    <button id="connectBleButton">Connect</button>
    <button id="disconnectBleButton">Disconnect</button>
  </div>
  <p>BLE state: <strong><span id="bleState" style="color:#d13a30;">Disconnected</span></strong></p>
  <p>Fetched Value:<span id="valueContainer">NaN</span></p>
  <input type="range" id="tiltSlider" min="0" max="180" step="1" value="0" disabled>
  <div class="value" id="tiltValue">Tilt: ?</div>
  <div id="isWritingOutput">Is writing?</div>
  <div class="button-container">
      <button id="correctionSpeedDown">&#8592;</button>
      <div id="correctionSpeed">Correction: x</div>
      <button id="correctionSpeedUp">&#8594;</button>
  </div>
  <div class="button-container">
      <button id="balanceBufferDown">&#8592;</button>
      <div id="balanceBuffer">Buffer: x</div>
      <button id="balanceBufferUp">&#8594;</button>
  </div>
  <div class="button-container">
      <button id="leftOffsetDown">&#8592;</button>
      <div id="leftOffset">Left: x</div>
      <button id="leftOffsetUp">&#8594;</button>
  </div>
  <div class="button-container">
      <button id="rightOffsetDown">&#8592;</button>
      <div id="rightOffset">Right: x</div>
      <button id="rightOffsetUp">&#8594;</button>
  </div>
  <div class="button-container">
    <button id="onButton">OFF</button>
    <div>LED</div>
    <button id="offButton">ON</button>
  </div>
</body>
<script src="script.js"></script>
</html>
